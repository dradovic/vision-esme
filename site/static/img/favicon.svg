<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      circle {
        fill: none;
        stroke: #FFD700; /* Gold color */
        stroke-width: 2;
        opacity: 0.8;
      }
    </style>
  </defs>
  <!-- Center circle -->
  <circle cx="50" cy="50" r="20" />
  
  <!-- First ring (Seed of Life) -->
  <circle cx="50" cy="30" r="20" />
  <circle cx="67.32" cy="40" r="20" />
  <circle cx="67.32" cy="60" r="20" />
  <circle cx="50" cy="70" r="20" />
  <circle cx="32.68" cy="60" r="20" />
  <circle cx="32.68" cy="40" r="20" />
  
  <!-- Second ring (Flower of Life completion - simplified/cropped for icon) -->
  <circle cx="50" cy="10" r="20" />
  <circle cx="67.32" cy="20" r="20" />
  <circle cx="84.64" cy="50" r="20" />
  <circle cx="67.32" cy="80" r="20" />
  <circle cx="50" cy="90" r="20" />
  <circle cx="32.68" cy="80" r="20" />
  <circle cx="15.36" cy="50" r="20" />
  <circle cx="32.68" cy="20" r="20" />
  
  <!-- Outer clipping reinforcement for visual weight -->
  <circle cx="50" cy="50" r="48" stroke-width="3" />
</svg>
